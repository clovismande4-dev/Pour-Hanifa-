<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Hanifa ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #faf5f3;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #2c2c2c;
    }
    .card {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      text-align: center;
      max-width: 380px;
      width: 100%;
      border: 1px solid #f0e6e4;
      transition: all 0.3s ease;
    }
    .hidden { display: none; }
    
    .heart-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }
    
    .subtitle {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #8c7b79;
      margin-bottom: 12px;
    }
    
    h1 {
      font-size: 24px;
      color: #701c27;
      margin-bottom: 10px;
      font-weight: normal;
      line-height: 1.3;
    }
    
    p.joke {
      font-size: 12px;
      font-style: italic;
      color: #a08e8c;
      margin-bottom: 25px;
    }
    
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      align-items: center;
      min-height: 50px;
    }
    
    button {
      padding: 12px 28px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
      border: 1px solid #701c27;
      transition: transform 0.2s, background-color 0.2s;
    }
    
    .btn-primary {
      background-color: #701c27;
      color: white;
    }
    
    .btn-secondary {
      background-color: white;
      color: #701c27;
    }
    
    /* Affichage de l'heure unique */
    .single-time-box {
      background-color: #701c27;
      color: white;
      padding: 15px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
      letter-spacing: 1px;
    }
    
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0d0ce;
      border-radius: 8px;
      margin-bottom: 20px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    
    input[type="text"]:focus {
      border-color: #701c27;
    }
  </style>
</head>
<body>

  <!-- ÉTAPE 1 : La question -->
  <div class="card" id="step1">
    <div class="heart-icon">💌</div>
    <div class="subtitle">Pour toi, Hanifa</div>
    <h1>Ça te dit qu'on se voie ce jeudi ?</h1>
    <p class="joke" id="joke-text">(Dire non ne sert à rien, mais tu peux essayer 😉)</p>
    
    <div class="btn-container">
      <button class="btn-primary" onclick="goToStep2()">Oui ❤️</button>
      <button class="btn-secondary" id="btn-non" onclick="handleNo()">Non</button>
    </div>
  </div>

  <!-- ÉTAPE 2 : Confirmation de l'heure fixe -->
  <div class="card hidden" id="step2">
    <div class="subtitle">Parfait !</div>
    <h1>Rendez-vous fixé à :</h1>
    
    <div class="single-time-box">
      🕒 19h00
    </div>

    <input type="text" id="user-note" placeholder="Un petit mot pour moi... (facultatif)">
    <button class="btn-primary" style="width: 100%;" onclick="finish()">Confirmer ✨</button>
  </div>

  <!-- ÉTAPE 3 : Message final -->
  <div class="card hidden" id="step3">
    <div class="heart-icon">❤️</div>
    <div class="subtitle">C'est noté !</div>
    <h1>Rendez-vous ce jeudi à 19h !</h1>
    <p style="margin-top: 15px; color: #701c27; font-size: 15px;">J'ai déjà hâte de te voir. 🥰</p>
  </div>

  <script>
    let clickCount = 0;
    const jokes = [
      "Mauvaise touche... essaie encore ! 😜",
      "Tu es sûre ? Le bouton 'Oui' est juste à côté ! 🥺",
      "Hop hop hop, le bouton 'Non' ne fonctionne pas ici ! 😂",
      "Bon d'accord, clique sur 'Oui' maintenant ❤️"
    ];

    function handleNo() {
      const btnNo = document.getElementById('btn-non');
      const jokeText = document.getElementById('joke-text');
      
      clickCount++;
      if (clickCount < jokes.length) {
        jokeText.innerText = jokes[clickCount];
        btnNo.style.transform = `scale(${1 - clickCount * 0.2})`;
      } else {
        btnNo.style.display = 'none';
        jokeText.innerText = "Voilà, tu n'as plus le choix ! 😁";
      }
    }

    function goToStep2() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }

    function finish() {
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
    }
  </script>
</body>
</html>
